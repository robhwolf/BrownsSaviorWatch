name: Update Savior Watch

on:
  schedule:
    # ---------------------------------------------------------------------
    # All crons are UTC. Eastern equivalents below assume EDT (UTC-4);
    # everything shifts an hour earlier in ET once clocks fall back.
    # ---------------------------------------------------------------------

    # Friday night football: hourly, 6pm ET Fri through 2am ET Sat.
    - cron: '0 22,23 * * 5'
    - cron: '0 0-6 * * 6'

    # Saturday slate: hourly, 11am ET Sat through 3am ET Sun.
    - cron: '0 15-23 * * 6'
    - cron: '0 0-7 * * 0'

    # Sunday cleanup, once the late finals have settled: 10am and 4pm ET.
    - cron: '0 14,20 * * 0'

    # Every other day: 8am, 2pm and 8pm ET.
    - cron: '0 12,18,0 * * 1,2,3,4,5'

  workflow_dispatch:        # lets you trigger a run by hand

permissions:
  contents: write

concurrency:
  group: savior-watch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch data
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python fetch_data.py

      - name: Commit if changed
        run: |
          git config user.name  "savior-watch-bot"
          git config user.email "actions@github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "data: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
